<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>어텐션 포트폴리오 관리</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f2;color:#171717;font-family:system-ui,'Malgun Gothic',sans-serif}main{max-width:800px;margin:50px auto;padding:24px}h1{font-size:30px}p{line-height:1.65;color:#555}.panel{background:white;border:1px solid #ddd;border-radius:15px;padding:24px;margin:20px 0}label{display:block;font-weight:700;margin:16px 0 8px}input[type=password],input[type=file]{width:100%;padding:12px;border:1px solid #aaa;border-radius:8px}button{border:0;border-radius:8px;background:#202020;color:white;padding:12px 18px;cursor:pointer;font-weight:700;margin-top:12px}button:disabled{opacity:.45;cursor:wait}.danger{background:#aa3030}.hint{font-size:13px}#status{white-space:pre-wrap;font-weight:600}#items{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:14px;margin-top:20px}.item img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}.item button{width:100%;font-size:12px}.item{min-width:0}a{color:#386a14}</style></head><body><main><h1>ATTENTION / 포트폴리오 관리</h1><p>사진을 올리거나 삭제하면 홈페이지에 반영됩니다. GitHub 계정의 접근 토큰은 서버나 브라우저에 저장하지 않습니다.</p><div class="panel"><label for="token">GitHub 접근 토큰 (Contents: Read and write)</label><input id="token" type="password" autocomplete="off" placeholder="github_pat_..."><p class="hint">토큰은 이 페이지에서만 사용합니다. 공유 PC에서는 사용하지 마세요. 토큰을 누구에게도 보내지 마세요.</p><button id="connect">사진 목록 불러오기</button></div><div class="panel"><h2>사진 추가</h2><input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple><p class="hint">JPG · PNG · WEBP / 사진당 8MB 이하 권장. 사진은 선택한 순서대로 맨 뒤에 추가됩니다.</p><button id="upload" disabled>선택한 사진 업로드</button><p id="status" role="status"></p></div><div class="panel"><h2>현재 포트폴리오</h2><p class="hint">삭제하면 홈페이지에서도 사라집니다. 실수로 삭제하지 않도록 확인창이 표시됩니다.</p><div id="items"></div></div><p><a href="/" target="_blank" rel="noopener">홈페이지 보기</a></p></main><script>
const owner='attention-print',repo='attention-print.github.io',base=`https://api.github.com/repos/${owner}/${repo}/contents/`;const $=id=>document.getElementById(id);let list=[],sha='';function status(s){$('status').textContent=s}function headers(){return {'Authorization':'Bearer '+$('token').value.trim(),'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}async function api(path,options={}){const r=await fetch(base+path,{...options,headers:{...headers(),...(options.body?{'Content-Type':'application/json'}:{})}});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(`${r.status}: ${data.message||'요청 실패'}`);return data}function encode64(bytes){let out='';for(let i=0;i<bytes.length;i+=8192)out+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(out)}function decode64(s){return decodeURIComponent(escape(atob(s.replace(/\s/g,''))))}async function load(){if(!$('token').value.trim())throw Error('접근 토큰을 입력해 주세요.');const data=await api('portfolio.json');sha=data.sha;list=JSON.parse(decode64(data.content));if(!Array.isArray(list))throw Error('사진 목록 형식 오류');render();$('upload').disabled=false;status(`사진 ${list.length}장 불러왔습니다.`)}function render(){const box=$('items');box.replaceChildren();for(const [i,path] of list.entries()){const div=document.createElement('div');div.className='item';const im=document.createElement('img');im.src='/'+path;im.alt='포트폴리오 사진 '+(i+1);const btn=document.createElement('button');btn.className='danger';btn.textContent='사진 삭제';btn.onclick=()=>remove(i);div.append(im,btn);box.append(div)}}async function save(next){const data=await api('portfolio.json',{method:'PUT',body:JSON.stringify({message:'Update portfolio gallery',content:btoa(unescape(encodeURIComponent(JSON.stringify(next,null,2)+'\n'))),sha})});sha=data.content.sha;list=next;render()}async function busy(fn){$('connect').disabled=$('upload').disabled=true;try{await fn()}catch(e){status('오류: '+e.message)}finally{$('connect').disabled=false;$('upload').disabled=false}}$('connect').onclick=()=>busy(load);$('upload').onclick=()=>busy(async()=>{const files=Array.from($('files').files);if(!files.length)throw Error('사진을 선택해 주세요.');let next=[...list];for(const [i,file] of files.entries()){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('JPG/PNG/WEBP만 가능합니다.');if(file.size>8*1024*1024)throw Error(file.name+'은 8MB를 초과합니다.');status(`${i+1}/${files.length} 업로드 중: ${file.name}`);const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';const name=`portfolio/${Date.now()}-${i}-${Math.random().toString(36).slice(2,8)}.${ext}`;const content=encode64(new Uint8Array(await file.arrayBuffer()));await api(name,{method:'PUT',body:JSON.stringify({message:'Add portfolio photo',content})});next.push(name);await save(next)}$('files').value='';status(`${files.length}장 추가 완료! 홈페이지에서 확인해 주세요.`)});async function remove(i){const path=list[i];if(!confirm('이 사진을 홈페이지에서 삭제할까요?'))return;await busy(async()=>{status('삭제 중...');await save(list.filter((_,j)=>j!==i));try{const f=await api(path);await api(path,{method:'DELETE',body:JSON.stringify({message:'Remove portfolio photo',sha:f.sha})})}catch(e){status('목록에서 삭제 완료. 파일 정리는 실패: '+e.message);return}status('삭제 완료!')})}
</script></body></html>
